services:
  zero2prod:
    build: .
    restart: always
    ports:
      - "8080:80"
    environment:
      APP_ENV: ${APP_ENV}
    depends_on:
      postgres:
        restart: true
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

networks:
  default:
    name: zero2prod
