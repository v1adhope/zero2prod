[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[dev-dependencies]
reqwest = "0.12.23"

[dependencies]
actix-web = "4"
tracing-actix-web = { version = "0.7", features = ["uuid_v7"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde-aux = "4"
config = "0.15"
uuid = { version = "1", features = ["v7"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-bunyan-formatter = "0.3"
tracing-log = "0.2"
once_cell = "1"
secrecy = { version = "0.10", features = ["serde"] }

[dependencies.sqlx]
version = "0.8"
default-features = false
features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono"]
